
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maison de Beauté | Institut & Soins</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container py-4">

    <header class="text-center mb-5">
      <p class="text-uppercase">Votre beauté, notre passion</p>
      <h1>Maison de Beauté</h1>
      <p>Institut de beauté · Soins · Cosmétiques</p>
    </header>

    <div class="row mb-4">
      <div class="col-md-3 mb-3">
        <div class="card indicator-card text-center p-3 h-100">
          <h5>Clientes</h5>
          <h2 id="total-customers">0</h2>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card indicator-card text-center p-3 h-100">
          <h5>Produits beauté</h5>
          <h2 id="total-products">0</h2>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card indicator-card text-center p-3 h-100">
          <h5>Réservations & commandes</h5>
          <h2 id="total-orders">0</h2>
        </div>
      </div>

      <div class="col-md-3 mb-3">
        <div class="card indicator-card text-center p-3 h-100">
          <h5>Montant total</h5>
          <h2 id="total-amount">0 MAD</h2>
        </div>
      </div>
    </div>

    <section class="card p-4 mb-4">
      <h3 class="mb-3">Rechercher & filtrer</h3>

      <div class="row g-3">
        <div class="col-md-4">
          <label for="search" class="form-label">
            Rechercher une cliente
          </label>
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Nom de la cliente">
        </div>

        <div class="col-md-4">
          <label for="status-filter" class="form-label">
            Statut
          </label>
          <select id="status-filter" class="form-select">
            <option value="all">Tous les statuts</option>
            <option value="Confirmée">Confirmée</option>
            <option value="En attente">En attente</option>
            <option value="Annulée">Annulée</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="category-filter" class="form-label">
            Catégorie beauté
          </label>
          <select id="category-filter" class="form-select">
            <option value="all">Toutes les catégories</option>
            <option value="Soins du visage">Soins du visage</option>
            <option value="Cheveux">Cheveux</option>
            <option value="Ongles">Ongles</option>
            <option value="Protection solaire">Protection solaire</option>
          </select>
        </div>
      </div>
    </section>

    <div id="error-message" class="alert alert-danger d-none"></div>

    <section class="mb-4">
      <h3 class="mb-3">Nos commandes & réservations</h3>
      <div id="orders-list" class="row g-3"></div>
    </section>

    <section id="order-details" class="card p-4 mt-4 d-none">
      <h3>Détails de la commande</h3>
      <div id="details-content"></div>
    </section>

    <footer class="text-center mt-5 py-3">
      <p>Maison de Beauté · Prenez soin de vous 🌸</p>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
